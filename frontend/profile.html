<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - JobSeeker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="profile-page">
  <!-- Navigation Header -->
  <nav class="navbar">
    <div class="navbar-container">
      <h2 class="navbar-logo">JobSeeker</h2>
      <ul class="navbar-menu">
        <li><a href="profile.html" class="navbar-link">Profile</a></li>
        <li><a href="job-search.html" class="navbar-link">Search Jobs</a></li>
        <li><a href="login.html" id="logoutBtn" class="navbar-link logout-link">Logout</a></li>
      </ul>
    </div>
  </nav>

  <div class="profile-wrapper">
    <div class="profile-container">
      <!-- Profile Header -->
      <div class="profile-header">
        <h1 id="profileUserName">User Name</h1>
        <div class="user-info">
          <p>User Profile</p>
          <p class="user-email">📧 <span id="profileUserEmail">user@example.com</span></p>
        </div>
      </div>

      <!-- Tab Navigation -->
      <ul class="tabs-nav">
        <li>
          <button class="tab-button active" data-tab="cv">
            📄 My CV
          </button>
        </li>
        <li>
          <button class="tab-button" data-tab="history">
            📤 Send History
          </button>
        </li>
        <li>
          <button class="tab-button" data-tab="settings">
            ⚙️ Profile Settings
          </button>
        </li>
      </ul>

      <!-- CV Tab -->
      <div id="cv" class="tab-content active">
        <div class="cv-section">
          <button class="add-cv-btn" id="addCvBtn">+ Add New CV</button>

          <div class="cv-list" id="cvListContainer">
            <p class="empty-state" id="cvEmptyState">No CVs yet.</p>
          </div>
        </div>
      </div>

      <!-- History Tab -->
      <div id="history" class="tab-content">
        <div class="history-section">
          <table class="history-table">
            <thead>
              <tr>
                <th>Job Title</th>
                <th>Company</th>
                <th>Sent Date</th>
                <th>Status</th>
                <th>CV Used</th>
              </tr>
            </thead>
            <tbody id="historyTableBody">
            </tbody>
          </table>
          <p class="history-empty" id="historyEmptyState">No send history yet.</p>
        </div>
      </div>

      <!-- Settings Tab -->
      <div id="settings" class="tab-content">
        <div class="settings-section">
          <form id="settingsForm">
            <div class="form-group">
              <label for="fullName">Full Name</label>
              <input type="text" id="fullName" name="fullName" required>
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" name="phone">
            </div>

            <div class="form-group">
              <label for="profession">Profession / Job Title</label>
              <input type="text" id="profession" name="profession">
            </div>

            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" name="city">
            </div>

            <div class="form-group">
              <label for="bio">About Me</label>
              <textarea id="bio" name="bio" placeholder="Write a short description about yourself..."></textarea>
            </div>

            <div class="form-group">
              <label for="notifications">Email Notifications</label>
              <select id="notifications" name="notifications">
                <option value="all">Receive all notifications</option>
                <option value="important">Important notifications only</option>
                <option value="none">No notifications</option>
              </select>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn-save">Save Changes</button>
              <button type="reset" class="btn-cancel">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_PROFILE = {
      fullName: "",
      email: "",
      phone: "",
      profession: "",
      city: "",
      bio: "",
      notifications: "all"
    };

    function getStoredProfile() {
      try {
        const raw = localStorage.getItem("profileSettings");
        if (!raw) {
          return DEFAULT_PROFILE;
        }

        const parsed = JSON.parse(raw);
        return {
          ...DEFAULT_PROFILE,
          ...parsed
        };
      } catch (_error) {
        return DEFAULT_PROFILE;
      }
    }

    function populateProfileHeader(profile) {
      const userNameElement = document.getElementById("profileUserName");
      const userEmailElement = document.getElementById("profileUserEmail");
      userNameElement.textContent = profile.fullName || "User Name";
      userEmailElement.textContent = profile.email || "user@example.com";
    }

    function populateSettingsForm(profile) {
      document.getElementById("fullName").value = profile.fullName || "";
      document.getElementById("email").value = profile.email || "";
      document.getElementById("phone").value = profile.phone || "";
      document.getElementById("profession").value = profile.profession || "";
      document.getElementById("city").value = profile.city || "";
      document.getElementById("bio").value = profile.bio || "";
      document.getElementById("notifications").value = profile.notifications || "all";
    }

    const profileData = getStoredProfile();
    populateProfileHeader(profileData);
    populateSettingsForm(profileData);

    // Tab functionality
    document.querySelectorAll('.tab-button').forEach(button => {
      button.addEventListener('click', () => {
        const tabName = button.getAttribute('data-tab');

        // Remove active from all tabs and buttons
        document.querySelectorAll('.tab-content').forEach(tab => {
          tab.classList.remove('active');
        });
        document.querySelectorAll('.tab-button').forEach(btn => {
          btn.classList.remove('active');
        });

        // Add active to selected tab and button
        document.getElementById(tabName).classList.add('active');
        button.classList.add('active');
      });
    });

    // Settings form submission
    document.getElementById('settingsForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const formData = {
        fullName: document.getElementById('fullName').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        profession: document.getElementById('profession').value,
        city: document.getElementById('city').value,
        bio: document.getElementById('bio').value,
        notifications: document.getElementById('notifications').value
      };

      console.log('Profile settings saved:', formData);
      localStorage.setItem("profileSettings", JSON.stringify(formData));
      populateProfileHeader(formData);
      alert('Profile settings saved successfully!');
      // TODO: Add API call to save settings
    });

    // Add CV button
    document.getElementById('addCvBtn').addEventListener('click', () => {
      window.location.href = 'cv.html?action=create';
    });

    // Load and display CVs
    function getStoredCVs() {
      try {
        const raw = localStorage.getItem("userCVs");
        return raw ? JSON.parse(raw) : [];
      } catch (_error) {
        return [];
      }
    }

    function renderCVList() {
      const cvs = getStoredCVs();
      const cvListContainer = document.getElementById('cvListContainer');
      const cvEmptyState = document.getElementById('cvEmptyState');
      
      if (cvs.length === 0) {
        cvEmptyState.style.display = 'block';
        cvListContainer.innerHTML = '';
        return;
      }

      cvEmptyState.style.display = 'none';
      cvListContainer.innerHTML = '';

      cvs.forEach(cv => {
        const cvCard = document.createElement('div');
        cvCard.className = 'cv-card';
        const createdDate = new Date(cv.createdAt).toLocaleDateString();
        
        cvCard.innerHTML = `
          <h3>${cv.name || 'Unnamed CV'}</h3>
          <p class="cv-info">Email: ${cv.email || '-'}</p>
          <p class="cv-info">Phone: ${cv.phone || '-'}</p>
          <p class="cv-info">Created: ${createdDate}</p>
          <div class="cv-actions">
            <button class="cv-edit-btn" data-id="${cv.id}">Edit</button>
            <button class="cv-delete-btn" data-id="${cv.id}">Delete</button>
          </div>
        `;
        
        cvListContainer.appendChild(cvCard);
      });

      // Add event listeners for edit buttons
      document.querySelectorAll('.cv-edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const cvId = btn.getAttribute('data-id');
          window.location.href = `cv.html?action=edit&id=${cvId}`;
        });
      });

      // Add event listeners for delete buttons
      document.querySelectorAll('.cv-delete-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const cvId = btn.getAttribute('data-id');
          if (confirm('Are you sure you want to delete this CV?')) {
            let cvs = getStoredCVs();
            cvs = cvs.filter(cv => cv.id !== cvId);
            localStorage.setItem('userCVs', JSON.stringify(cvs));
            renderCVList();
          }
        });
      });
    }

    // Initial render of CVs
    renderCVList();

  </script>
</body>
</html>
