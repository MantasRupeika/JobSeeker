<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobSeeker | Registration</title>
</head>
<body>
  <main>
    <section aria-labelledby="registration-heading">
      <h1 id="registration-heading">Create Account</h1>
      <p>Sign up to start applying for jobs with JobSeeker.</p>

      <form action="#" method="post">
        <div>
          <label for="fullName">Full Name</label>
          <input id="fullName" name="fullName" type="text" autocomplete="name" required>
        </div>

        <div>
          <label for="homeAddress">Home Address</label>
          <input id="homeAddress" name="homeAddress" type="text" autocomplete="street-address" required>
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div>
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required>
        </div>

        <div>
          <label for="confirmPassword">Confirm Password</label>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required>
        </div>

        <div>
          <button type="submit">Register</button>
        </div>
      </form>

      <p>Already have an account? <a href="login.html">Sign in</a></p>
    </section>
  </main>
</body>
</html>
