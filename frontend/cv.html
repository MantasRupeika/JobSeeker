<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobSeeker | CV Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-main">
    <section class="auth-card cv-card" aria-labelledby="cv-heading">
      <h1 id="cv-heading">Create Your CV</h1>
      <p class="auth-subtitle">Fill in all required details to build your CV profile.</p>
      <p id="cvFeedback" class="form-feedback" role="status" aria-live="polite"></p>

      <form id="cvForm" class="auth-form" action="#" method="post" enctype="multipart/form-data" novalidate>
        <div class="form-row">
          <label for="name">Full Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required>
        </div>

        <div class="form-row">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="form-row">
          <label for="phone">Phone Number</label>
          <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="numeric" pattern="[0-9]+" title="Phone number must contain numbers only" required>
        </div>

        <div class="form-row">
          <label for="education">Education</label>
          <textarea id="education" name="education" rows="4" required></textarea>
        </div>

        <div class="form-row">
          <label for="experience">Work Experience</label>
          <textarea id="experience" name="experience" rows="5" required></textarea>
        </div>

        <div class="form-row">
          <label for="skills">Skills</label>
          <textarea id="skills" name="skills" rows="4" placeholder="Example: JavaScript, SQL, React" required></textarea>
        </div>

        <div class="form-row">
          <label for="cvFile">Upload CV File (PDF or DOCX, optional)</label>
          <input id="cvFile" name="cvFile" type="file" accept=".pdf,.doc,.docx">
        </div>

        <div class="form-row">
          <button id="previewBtn" class="secondary-btn" type="button">Preview CV</button>
        </div>

        <div class="form-row">
          <button type="submit">Save CV</button>
        </div>
      </form>

      <section id="cvPreview" class="cv-preview-modal" aria-labelledby="cv-preview-heading" hidden>
        <div class="cv-preview-panel" role="dialog" aria-modal="true" aria-labelledby="cv-preview-heading">
          <button id="closePreviewBtn" class="close-preview-btn" type="button" aria-label="Close preview">x</button>
          <h2 id="cv-preview-heading">CV Preview</h2>
          <div class="cv-preview-grid">
            <p><strong>Name:</strong> <span id="previewName">-</span></p>
            <p><strong>Email:</strong> <span id="previewEmail">-</span></p>
            <p><strong>Phone:</strong> <span id="previewPhone">-</span></p>
          </div>
          <div class="cv-preview-block">
            <h3>Education</h3>
            <p id="previewEducation">-</p>
          </div>
          <div class="cv-preview-block">
            <h3>Work Experience</h3>
            <p id="previewExperience">-</p>
          </div>
          <div class="cv-preview-block">
            <h3>Skills</h3>
            <p id="previewSkills">-</p>
          </div>
          <div class="cv-preview-block">
            <h3>File</h3>
            <p id="previewFile">-</p>
          </div>
        </div>
      </section>

      <p class="auth-switch">Need to sign in first? <a href="login.html">Go to Login</a></p>
    </section>
  </main>
  <script src="cv-preview.js"></script>
</body>
</html>
