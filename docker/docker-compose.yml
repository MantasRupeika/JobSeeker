services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: jobseeker-app
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret}
    ports:
      - "3000:3000"
    volumes:
      - ../backend/data:/app/backend/data
    restart: unless-stopped
